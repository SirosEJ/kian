name: Test and Deploy Story Preview

on:
  push:
    branches:
      - 'SFT-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: kian-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm typecheck
      - run: pnpm build

  deploy-preview:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Derive story preview service
        id: preview
        shell: bash
        run: |
          JIRA_KEY="$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '^SFT-[0-9]+' | tr '[:upper:]' '[:lower:]')"
          test -n "$JIRA_KEY"
          echo "service=kian-${JIRA_KEY}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Create or reuse story database branch (Neon)
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          NEON_ROLE: ${{ vars.NEON_ROLE }}
        run: |
          API="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          AUTH="Authorization: Bearer ${NEON_API_KEY}"
          NAME="${{ steps.preview.outputs.service }}"
          BRANCH_ID="$(curl -fsS -H "$AUTH" "$API/branches?search=${NAME}" | jq -r --arg n "$NAME" '.branches[] | select(.name==$n) | .id' | head -n1)"
          if [ -z "$BRANCH_ID" ]; then
            BRANCH_ID="$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d "{\"branch\":{\"name\":\"${NAME}\"},\"endpoints\":[{\"type\":\"read_write\"}]}" \
              "$API/branches" | jq -r '.branch.id')"
          fi
          test -n "$BRANCH_ID" && test "$BRANCH_ID" != null
          URI="$(curl -fsS -H "$AUTH" "$API/connection_uri?branch_id=${BRANCH_ID}&database_name=${NEON_DATABASE}&role_name=${NEON_ROLE}&pooled=false" | jq -r '.uri')"
          test -n "$URI" && test "$URI" != null
          echo "::add-mask::$URI"
          echo "url=$URI" >> "$GITHUB_OUTPUT"

      - name: Deploy current branch to Cloud Run preview
        run: |
          gcloud run deploy "${{ steps.preview.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --source . \
            --region europe-west1 \
            --platform managed \
            --no-invoker-iam-check \
            --no-cpu-throttling \
            --command "sh" --args "scripts/preview-entrypoint.sh" \
            --set-build-env-vars="VITE_FIREBASE_API_KEY=${{ vars.KIAN_FIREBASE_API_KEY }},VITE_FIREBASE_AUTH_DOMAIN=${{ vars.KIAN_FIREBASE_AUTH_DOMAIN }},VITE_FIREBASE_PROJECT_ID=${{ vars.KIAN_FIREBASE_PROJECT_ID }}" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ vars.KIAN_FIREBASE_PROJECT_ID }},DATABASE_URL=${{ steps.db.outputs.url }}" \
            --set-secrets="OPENAI_API_KEY=estate-openai-api-key:latest,KIAN_ENCRYPTION_KEY=kian-staging-encryption-key:latest" \
            --memory=1Gi \
            --timeout=900 \
            --quiet

      - name: Read preview URL
        id: preview_url
        run: |
          URL="$(gcloud run services describe "${{ steps.preview.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region europe-west1 --format='value(status.url)')"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public preview health
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-all-errors \
            "${{ steps.preview_url.outputs.url }}/health" | tee /tmp/health.json
          grep -Eq '"status": ?"ok"' /tmp/health.json
