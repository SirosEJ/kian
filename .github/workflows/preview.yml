name: Test and Deploy Story Preview

on:
  push:
    branches:
      - 'SFT-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: kian-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm typecheck
      - run: pnpm build

  deploy-preview:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Derive story preview service
        id: preview
        shell: bash
        run: |
          JIRA_KEY="$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '^SFT-[0-9]+' | tr '[:upper:]' '[:lower:]')"
          test -n "$JIRA_KEY"
          echo "service=kian-${JIRA_KEY}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Create or reuse story database branch (Neon)
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          NEON_ROLE: ${{ vars.NEON_ROLE }}
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          NAME="${{ steps.preview.outputs.service }}"
          # Calls the Neon API; on a non-2xx answer, fail with Neon's own message instead of carrying on with empty values.
          neon() {
            local code
            code="$(curl -sS -o /tmp/neon-response.json -w '%{http_code}' -X "$1" -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Content-Type: application/json' ${3:+-d "$3"} "${API}$2")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Neon API $1 $2 returned HTTP ${code}: $(jq -r '.message // .' /tmp/neon-response.json)" >&2
              exit 1
            fi
            cat /tmp/neon-response.json
          }
          BRANCH_ID="$(neon GET "/branches?search=${NAME}" | jq -r --arg n "$NAME" '[.branches[] | select(.name==$n) | .id][0] // empty')"
          if [ -z "$BRANCH_ID" ]; then
            BRANCH_ID="$(neon POST /branches "{\"branch\":{\"name\":\"${NAME}\"},\"endpoints\":[{\"type\":\"read_write\"}]}" | jq -r '.branch.id // empty')"
          fi
          [ -n "$BRANCH_ID" ] || { echo "::error::Neon returned no branch id for ${NAME}" >&2; exit 1; }
          URI="$(neon GET "/connection_uri?branch_id=${BRANCH_ID}&database_name=${NEON_DATABASE}&role_name=${NEON_ROLE}&pooled=false" | jq -r '.uri // empty')"
          [ -n "$URI" ] || { echo "::error::Neon returned no connection URI for ${NAME}" >&2; exit 1; }
          echo "::add-mask::$URI"
          echo "url=$URI" >> "$GITHUB_OUTPUT"

      - name: Write public Firebase web config for the image build
        run: |
          # Public client values. Cloud Run --set-build-env-vars does not reach Dockerfile builds,
          # so the Dockerfile sources this file before `pnpm build`.
          {
            echo "VITE_FIREBASE_API_KEY=${{ vars.KIAN_FIREBASE_API_KEY }}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.KIAN_FIREBASE_AUTH_DOMAIN }}"
            echo "VITE_FIREBASE_PROJECT_ID=${{ vars.KIAN_FIREBASE_PROJECT_ID }}"
          } > firebase-public.env

      - name: Deploy current branch to Cloud Run preview
        run: |
          gcloud run deploy "${{ steps.preview.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --source . \
            --region europe-west1 \
            --platform managed \
            --no-invoker-iam-check \
            --no-cpu-throttling \
            --command "sh" --args "scripts/preview-entrypoint.sh" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ vars.KIAN_FIREBASE_PROJECT_ID }},DATABASE_URL=${{ steps.db.outputs.url }}" \
            --set-secrets="OPENAI_API_KEY=estate-openai-api-key:latest,KIAN_ENCRYPTION_KEY=kian-staging-encryption-key:latest" \
            --memory=1Gi \
            --timeout=900 \
            --quiet

      - name: Read preview URL
        id: preview_url
        run: |
          URL="$(gcloud run services describe "${{ steps.preview.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region europe-west1 --format='value(status.url)')"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public preview health
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-all-errors \
            "${{ steps.preview_url.outputs.url }}/health" | tee /tmp/health.json
          grep -Eq '"status": ?"ok"' /tmp/health.json
