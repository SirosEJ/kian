name: Test and Deploy Story Preview

on:
  push:
    branches:
      - 'SFT-*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: kian-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm typecheck
      - run: pnpm build

  deploy-preview:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Derive story preview service
        id: preview
        shell: bash
        run: |
          JIRA_KEY="$(printf '%s' "$GITHUB_REF_NAME" | grep -oE '^SFT-[0-9]+' | tr '[:upper:]' '[:lower:]')"
          test -n "$JIRA_KEY"
          echo "service=kian-${JIRA_KEY}" >> "$GITHUB_OUTPUT"
          echo "database=kian_${JIRA_KEY//-/_}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Create story database (idempotent)
        run: |
          gcloud sql databases describe "${{ steps.preview.outputs.database }}" \
            --instance "${{ vars.KIAN_SQL_INSTANCE }}" --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1 \
          || gcloud sql databases create "${{ steps.preview.outputs.database }}" \
            --instance "${{ vars.KIAN_SQL_INSTANCE }}" --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Deploy current branch to Cloud Run preview
        run: |
          gcloud run deploy "${{ steps.preview.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --source . \
            --region europe-west1 \
            --platform managed \
            --no-invoker-iam-check \
            --no-cpu-throttling \
            --add-cloudsql-instances "${{ vars.GCP_PROJECT_ID }}:europe-west1:${{ vars.KIAN_SQL_INSTANCE }}" \
            --command "sh" --args "scripts/preview-entrypoint.sh" \
            --set-build-env-vars="VITE_FIREBASE_API_KEY=${{ vars.KIAN_FIREBASE_API_KEY }},VITE_FIREBASE_AUTH_DOMAIN=${{ vars.KIAN_FIREBASE_AUTH_DOMAIN }},VITE_FIREBASE_PROJECT_ID=${{ vars.KIAN_FIREBASE_PROJECT_ID }}" \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${{ vars.KIAN_FIREBASE_PROJECT_ID }},INSTANCE_CONNECTION_NAME=${{ vars.GCP_PROJECT_ID }}:europe-west1:${{ vars.KIAN_SQL_INSTANCE }},DB_USER=kian,DB_NAME=${{ steps.preview.outputs.database }}" \
            --set-secrets="DB_PASSWORD=kian-staging-db-password:latest,OPENAI_API_KEY=estate-openai-api-key:latest,KIAN_ENCRYPTION_KEY=kian-staging-encryption-key:latest" \
            --memory=1Gi \
            --timeout=900 \
            --quiet

      - name: Read preview URL
        id: preview_url
        run: |
          URL="$(gcloud run services describe "${{ steps.preview.outputs.service }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region europe-west1 --format='value(status.url)')"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public preview health
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-all-errors \
            "${{ steps.preview_url.outputs.url }}/health" | tee /tmp/health.json
          grep -Eq '"status": ?"ok"' /tmp/health.json
