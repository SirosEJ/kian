name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: kian-staging
  cancel-in-progress: false

env:
  SERVICE: kian-staging
  REGION: europe-west1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' build
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm typecheck
      - run: pnpm build

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Create or reuse staging database branch (Neon)
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DATABASE: ${{ vars.NEON_DATABASE }}
          NEON_ROLE: ${{ vars.NEON_ROLE }}
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          NAME="${SERVICE}"
          # Calls the Neon API; on a non-2xx answer, fail with Neon's own message instead of carrying on with empty values.
          neon() {
            local code
            code="$(curl -sS -o /tmp/neon-response.json -w '%{http_code}' -X "$1" -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Content-Type: application/json' ${3:+-d "$3"} "${API}$2")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Neon API $1 $2 returned HTTP ${code}: $(jq -r '.message // .' /tmp/neon-response.json)" >&2
              exit 1
            fi
            cat /tmp/neon-response.json
          }
          BRANCH_ID="$(neon GET "/branches?search=${NAME}" | jq -r --arg n "$NAME" '[.branches[] | select(.name==$n) | .id][0] // empty')"
          if [ -z "$BRANCH_ID" ]; then
            BRANCH_ID="$(neon POST /branches "{\"branch\":{\"name\":\"${NAME}\"},\"endpoints\":[{\"type\":\"read_write\"}]}" | jq -r '.branch.id // empty')"
          fi
          [ -n "$BRANCH_ID" ] || { echo "::error::Neon returned no branch id for ${NAME}" >&2; exit 1; }
          URI="$(neon GET "/connection_uri?branch_id=${BRANCH_ID}&database_name=${NEON_DATABASE}&role_name=${NEON_ROLE}&pooled=false" | jq -r '.uri // empty')"
          [ -n "$URI" ] || { echo "::error::Neon returned no connection URI for ${NAME}" >&2; exit 1; }
          echo "::add-mask::$URI"
          echo "url=$URI" >> "$GITHUB_OUTPUT"

      - name: Write public Firebase web config for the image build
        run: |
          {
            echo "VITE_FIREBASE_API_KEY=${{ vars.KIAN_FIREBASE_API_KEY }}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.KIAN_FIREBASE_AUTH_DOMAIN }}"
            echo "VITE_FIREBASE_PROJECT_ID=${{ vars.KIAN_FIREBASE_PROJECT_ID }}"
          } > firebase-public.env

      - name: Resolve provider configuration
        id: providers
        env:
          GOOGLE_CLIENT_ID: ${{ vars.KIAN_GOOGLE_CLIENT_ID }}
          JIRA_CLIENT_ID: ${{ vars.KIAN_JIRA_CLIENT_ID }}
          TEAMS_CLIENT_ID: ${{ vars.KIAN_TEAMS_CLIENT_ID }}
          TEAMS_TENANT: ${{ vars.KIAN_TEAMS_TENANT }}
        run: |
          # Stable, deterministic Cloud Run URL: register https://<service>-<project number>.<region>.run.app/ as the OAuth redirect.
          PROJECT_NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" --format='value(projectNumber)')"
          BASE="https://${SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app/"
          ENVS="GOOGLE_CLOUD_PROJECT=${{ vars.KIAN_FIREBASE_PROJECT_ID }}"
          SECRETS="OPENAI_API_KEY=estate-openai-api-key:latest,KIAN_ENCRYPTION_KEY=kian-staging-encryption-key:latest"
          # Atlassian stores the callback without a trailing slash and compares it exactly, so Jira gets the address without one (Google keeps it).
          # A provider is switched on by its client ID variable; its secret must then exist (the deployer cannot look secrets up, so Cloud Run reports a missing one).
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            ENVS="$ENVS,GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID,GOOGLE_REDIRECT_URI=$BASE"
            SECRETS="$SECRETS,GOOGLE_CLIENT_SECRET=kian-google-client-secret:latest"
          else
            echo "::warning::Google Calendar not configured (set the variable KIAN_GOOGLE_CLIENT_ID, and create the secret kian-google-client-secret first)"
          fi
          if [ -n "$JIRA_CLIENT_ID" ]; then
            ENVS="$ENVS,JIRA_CLIENT_ID=$JIRA_CLIENT_ID,JIRA_REDIRECT_URI=${BASE%/}"
            SECRETS="$SECRETS,JIRA_CLIENT_SECRET=kian-jira-client-secret:latest"
          else
            echo "::warning::Jira Cloud not configured (set the variable KIAN_JIRA_CLIENT_ID, and create the secret kian-jira-client-secret first)"
          fi
          # Microsoft Teams: the redirect keeps the trailing slash (register it exactly in the Entra app). TEAMS_TENANT is optional (default: any work or school account).
          if [ -n "$TEAMS_CLIENT_ID" ]; then
            ENVS="$ENVS,TEAMS_CLIENT_ID=$TEAMS_CLIENT_ID,TEAMS_REDIRECT_URI=$BASE,TEAMS_TENANT=${TEAMS_TENANT:-organizations}"
            SECRETS="$SECRETS,TEAMS_CLIENT_SECRET=kian-teams-client-secret:latest"
          else
            echo "::warning::Microsoft Teams not configured (set the variable KIAN_TEAMS_CLIENT_ID, and create the secret kian-teams-client-secret first)"
          fi
          echo "envs=$ENVS" >> "$GITHUB_OUTPUT"
          echo "secrets=$SECRETS" >> "$GITHUB_OUTPUT"
          echo "Staging URL (OAuth redirect): $BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloud Run staging
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --source . \
            --region "${REGION}" \
            --platform managed \
            --no-invoker-iam-check \
            --no-cpu-throttling \
            --command "sh" --args "scripts/preview-entrypoint.sh" \
            --set-env-vars="${{ steps.providers.outputs.envs }},DATABASE_URL=${{ steps.db.outputs.url }}" \
            --set-secrets="${{ steps.providers.outputs.secrets }}" \
            --memory=1Gi \
            --timeout=900 \
            --quiet

      - name: Verify staging health
        run: |
          URL="$(gcloud run services describe "${SERVICE}" --project "${{ vars.GCP_PROJECT_ID }}" --region "${REGION}" --format='value(status.url)')"
          test -n "$URL"
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-all-errors "${URL}/health" | tee /tmp/health.json
          grep -Eq '"status": ?"ok"' /tmp/health.json
